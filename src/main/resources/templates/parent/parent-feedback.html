<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8"/>
<title>Feedback Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Comic Sans MS", cursive, sans-serif;
}

body{
background:#f8cfd4;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

/* Back Button */

.back-btn{
position:fixed;
top:20px;
left:20px;
width:48px;
height:48px;
background:#6fd58c;
border-radius:50%;
color:white;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
text-decoration:none;
z-index:1000;
}

/* Container */

.container{
width:90%;
max-width:1000px;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:25px;
}

/* Panel */

.panel{
background:#fdeaea;
border-radius:40px;
padding:30px 40px 40px;
}

.panel p{
font-size:22px;
margin-bottom:20px;
}

/* Textbox */

.feedback-box{
background:white;
border-radius:40px;
border:2px solid #000;
padding:20px;
height:320px;
}

.feedback-box textarea{
width:100%;
height:100%;
border:none;
outline:none;
resize:none;
font-size:18px;
background:transparent;
font-family:inherit;
}

/* Submit */

.submit-container{
text-align:center;
margin-top:25px;
}

.submit-btn{
background:#6fd58c;
color:white;
border:none;
padding:12px 45px;
font-size:20px;
border-radius:30px;
cursor:pointer;
}

.submit-btn:hover{
background:#5ac67a;
}

/* Success message */

.success{
display:none;
text-align:center;
margin-top:20px;
font-size:20px;
color:#2c7a4b;
font-weight:bold;
}

/* Responsive */

@media(max-width:768px){

h1{
font-size:32px;
}

.feedback-box{
height:240px;
}

}

</style>

</head>

<body>

<a href="/parent/dashboard" class="back-btn">←</a>

<div class="container">

<h1>Feedback Panel</h1>

<div class="panel">

<p><b>We would love to hear how we can improve!</b></p>

<form id="feedbackForm">

<div class="feedback-box">

<textarea
id="feedbackText"
name="feedback"
placeholder="Type your feedback here..."
required></textarea>

</div>

<div class="submit-container">

<button type="submit" class="submit-btn">
Submit Feedback
</button>

</div>

</form>

<div id="successMessage" class="success">
FEEDBACK SUBMITTED SUCCESSFULLY
</div>

</div>

</div>

<script>

const form = document.getElementById("feedbackForm");

form.addEventListener("submit", async function(e){

e.preventDefault();

const feedback = document.getElementById("feedbackText").value;

const response = await fetch("/parent/feedback/submit",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"feedback=" + encodeURIComponent(feedback)
});

if(response.ok){

document.getElementById("successMessage").style.display="block";

document.getElementById("feedbackText").value="";

}

});

</script>

</body>
</html>
