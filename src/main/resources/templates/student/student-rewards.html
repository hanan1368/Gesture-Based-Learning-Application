<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Rewards</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Comic Sans MS", cursive, sans-serif;
}

body{
background:#f8cfd4;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:100%;
max-width:1100px;
padding:40px;
position:relative;
}

/* BACK BUTTON */

.back-btn{
position:fixed;
top:20px;
left:20px;
width:48px;
height:48px;
background:#6fd58c;
border-radius:50%;
color:#fff;
font-size:22px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:1000;
}

/* TITLE */

.title{
text-align:center;
font-size:38px;
margin-bottom:40px;
}

/* CONTENT */

.content{
display:flex;
gap:40px;
justify-content:center;
align-items:stretch;
}

/* CARDS */

.card{
background:#fdeaea;
border-radius:30px;
padding:30px;
width:420px;
}

/* LEFT CARD */

.left-card{
text-align:center;
}

.medal{
font-size:90px;
margin-bottom:15px;
}

.left-card h2{
font-size:28px;
margin-bottom:10px;
}

.left-card p{
font-size:18px;
line-height:1.4;
margin-bottom:25px;
}

.share-btn{
background:#ff1c1c;
color:#fff;
border:none;
padding:14px 50px;
font-size:20px;
border-radius:30px;
cursor:pointer;
}

/* RIGHT CARD */

.right-card{
display:flex;
flex-direction:column;
gap:30px;
}

.total h3{
font-size:24px;
}

.total span{
font-size:28px;
font-weight:bold;
}

/* LEVELS */

.levels{
display:flex;
flex-direction:column;
gap:20px;
}

.level{
display:flex;
align-items:center;
gap:15px;
}

.star{
font-size:32px;
color:gold;
}

.bar{
width:180px;
height:18px;
border-radius:20px;
background:#555;
overflow:hidden;
}

.bar.full{
background:linear-gradient(to right,#9be15d,#00e3ae);
}

.bar.half{
background:linear-gradient(to right,#9be15d 50%,#555 50%);
}

.level label{
font-size:20px;
}

/* TROPHY */

.character{
position:absolute;
right:30px;
top:100px;
font-size:90px;
}

/* MOBILE */

@media(max-width:900px){

.content{
flex-direction:column;
align-items:center;
}

.character{
position:static;
text-align:center;
margin-top:20px;
}

}

</style>
</head>

<body>

<div class="container">

<button class="back-btn" onclick="location.href='/student/dashboard'">←</button>

<h1 class="title">Rewards Earned this week</h1>

<div class="content">

<!-- LEFT CARD -->

<div class="card left-card">

<div class="medal">⭐</div>

<h2>Congrats !</h2>

<p>
You earned <b th:text="${points}">0</b> points and
<br>unlocked new level !
</p>

<button class="share-btn">Share</button>

</div>

<!-- RIGHT CARD -->

<div class="card right-card">

<div class="total">
<h3>Total</h3>
<span th:text="${points} + ' Points'">0 Points</span>
</div>

<div class="levels">

<div class="level">
<span class="star">★</span>
<div class="bar full"></div>
<label>Level 1</label>
</div>

<div class="level">
<span class="star">★</span>
<div class="bar full"></div>
<label>Level 2</label>
</div>

<div class="level">
<span class="star">★</span>
<div class="bar half"></div>
<label>Level 3</label>
</div>

</div>

</div>

</div>

<div class="character">🏆</div>

</div>

</body>
</html>
