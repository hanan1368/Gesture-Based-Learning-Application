<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<title>Manage Users</title>

<style>

@font-face {
font-family:"Cascadia Mono";
src:local("Cascadia Mono"),
local("CascadiaMono"),
url("/fonts/CascadiaMono-Regular.woff2") format("woff2");
}

body{
margin:0;
background:#f6cfd4;
font-family:"Cascadia Mono", monospace;
}

.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
border-radius:50%;
background:#6acb71;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.back-btn span{
color:white;
font-size:22px;
}

.container{
max-width:850px;
margin:auto;
padding:90px 30px;
}

h1{
text-align:center;
margin-bottom:40px;
}

.card{
background:#fdeee9;
padding:30px;
border-radius:25px;
box-shadow:0 15px 30px rgba(0,0,0,0.1);
}

.user{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.delete-btn{
background:#7b6773;
color:white;
border:none;
padding:8px 15px;
border-radius:15px;
cursor:pointer;
font-family:"Cascadia Mono", monospace;
}

.delete-btn:hover{
background:#66545f;
}

</style>

</head>

<body>

<div class="back-btn" onclick="location.href='/admin/dashboard'">
<span>←</span>
</div>

<div class="container">

<h1>Delete Users Accounts</h1>

<div class="card">

<div class="user" th:each="u : ${users}">

<span>
<b th:text="${u.username}"></b>
[
<span th:text="${u.role}"></span>
]
</span>

<form action="/admin/delete-user" method="post">

<input type="hidden" name="id" th:value="${u.id}">

<button class="delete-btn" type="submit">
Delete
</button>

</form>

</div>

</div>

</div>

</body>
</html>
