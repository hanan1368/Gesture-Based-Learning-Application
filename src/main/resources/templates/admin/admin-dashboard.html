<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin Dashboard</title>

<link rel="stylesheet" href="/css/style.css"/>

<style>

@font-face {
font-family: "Cascadia Mono";
src: local("Cascadia Mono"),
local("CascadiaMono"),
url("/fonts/CascadiaMono-Regular.woff2") format("woff2");
}

/* Page */

body{
margin:0;
background:#f6cfd4;
font-family:"Cascadia Mono", monospace;
}

/* Back button */

.back-btn{
position:fixed;
top:20px;
left:20px;
width:44px;
height:44px;
border-radius:50%;
background:#6acb71;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:10;
}

.back-btn span{
color:#fff;
font-size:22px;
}

/* Page wrapper */

.admin-shell{
max-width:1400px;
margin:0 auto;
padding:90px 30px 40px;
text-align:center;
}

/* TITLE */

.admin-title{
font-size:42px;
margin-bottom:40px;
font-weight:bold;
}

/* GRID ROW */

.admin-grid{
display:flex;
justify-content:center;
align-items:center;
gap:40px;
flex-wrap:nowrap;
}

/* Card */

.admin-card{
background:#fdeee9;
border-radius:30px;
padding:25px;
height:260px;
width:260px;

display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;

transition:all .3s ease;
}

/* Image */

.card-img-wrap{
width:100%;
height:150px;
display:flex;
align-items:center;
justify-content:center;
}

.card-img-wrap img{
max-width:90%;
max-height:100%;
object-fit:contain;
transition:transform .3s ease;
}

/* Button */

.admin-pill{
margin-top:20px;
min-height:46px;
padding:12px 22px;
background:#7b6773;
color:#000;
border-radius:25px;
font-size:18px;
font-weight:500;
text-align:center;

display:flex;
align-items:center;
justify-content:center;

transition:all .3s ease;
}

/* Hover */

.admin-card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 18px 40px rgba(0,0,0,.15);
cursor:pointer;
}

.admin-card:hover img{
transform:scale(1.06);
}

.admin-card:hover .admin-pill{
background:#66545f;
color:#fff;
transform:scale(1.05);
}

.admin-card:active{
transform:translateY(-4px) scale(.98);
}

</style>
</head>

<body>

<div class="back-btn" onclick="location.href='/'">
<span>←</span>
</div>

<div class="admin-shell">

<h1 class="admin-title">Admin Dashboard</h1>

<div class="admin-grid">

<!-- EDIT OR UPDATE -->
<div class="admin-card" onclick="location.href='/admin/edit-lesson'">
<div class="card-img-wrap">
<img src="../assets/admin-edit-update.png">
</div>
<div class="admin-pill">Edit or update</div>
</div>

<!-- DELETE USERS -->
<div class="admin-card" onclick="location.href='/admin/manage-users'">
<div class="card-img-wrap">
<img src="../assets/admin-delete-deactivate.png">
</div>
<div class="admin-pill">Delete Users</div>
</div>

<!-- ANNOUNCEMENTS -->
<div class="admin-card" onclick="location.href='/admin/analytics'">
<div class="card-img-wrap">
<img src="../assets/admin-announcements.png">
</div>
<div class="admin-pill">Announcements</div>
</div>

<!-- PARENT FEEDBACK -->
<div class="admin-card" onclick="location.href='/admin/feedback'">
<div class="card-img-wrap">
<img src="../assets/admin-feedback.png">
</div>
<div class="admin-pill">Parent Feedback</div>
</div>

</div>

</div>

</body>
</html>
