<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Student Attendance</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #fff;
}

/* BACK BUTTON */

.back-btn{
  position:fixed;
  top:20px;
  left:20px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#6bd28c;
  color:#fff;
  font-size:22px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  z-index:10;
}

/* PAGE LAYOUT */

.attendance-shell {
  max-width: 1100px;
  margin: 0 auto;
  padding-top: 60px;
  text-align: center;
}

.attendance-calendar {
  width: 90%;
  max-width: 900px;
  margin: 0 auto;
  background: #ffffff;
  border-radius: 40px;
  padding: 30px 20px 40px;
  border: 2px solid #000;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  padding: 10px;
}

.day-box {
  background: #ffeef5;
  border-radius: 14px;
  padding: 12px 6px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #cccccc;
  font-size: 18px;
  cursor: pointer;
}

</style>

</head>

<body>

<!-- BACK BUTTON -->

<a class="back-btn" href="/student/dashboard">←</a>

<div class="attendance-shell">

<h1>Daily Attendance</h1>

<div class="attendance-calendar">

<div class="calendar-grid" id="calendarGrid"></div>

</div>

</div>

<!-- POPUP -->

<div id="popup" style="
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#ffeef5;
padding:20px;
border-radius:20px;
border:2px solid #000;
min-width:260px;
">

<p id="popupContent"></p>

<button onclick="closePopup()">Close</button>

</div>


<script th:inline="javascript">

/* TOTAL DAYS */

const totalDays = 35;

/* ATTENDED DAYS FROM BACKEND */

const attendedDays = /*[[${attendedDays}]]*/ [];

/* GRID */

const grid = document.getElementById("calendarGrid");

/* GENERATE DAY BOXES */

for (let i = 1; i <= totalDays; i++) {

  const box = document.createElement("div");
  box.className = "day-box";
  box.innerText = "Day " + i;

  /* HIGHLIGHT ATTENDED DAYS */

  if (attendedDays.includes(i)) {
    box.style.border = "3px solid red";
  }

  box.onclick = () => loadDayDetails(i);

  grid.appendChild(box);
}


/* ================= LOAD POPUP DATA ================= */

function loadDayDetails(day) {

fetch(`/student/attendance/details/Day ${day}`)

.then(response => {

if(!response.ok){
throw new Error("Server error");
}

return response.json();

})

.then(data => {

const date = data.date ? data.date : "Not recorded";
const minutes = data.minutes ? data.minutes : 0;
const questions = data.questions ? data.questions : 0;
const lesson = data.lessonCompleted ? "Yes" : "No";

document.getElementById("popupContent").innerHTML = `
<strong>Day ${day}</strong><br><br>
📅 Date Participated: ${date}<br>
⏱ Minutes Logged: ${minutes}<br>
❓ Questions Completed: ${questions}<br>
📘 Lesson Completed: ${lesson}
`;

document.getElementById("popup").style.display = "block";

})

.catch(error => {

document.getElementById("popupContent").innerHTML = `
<strong>Day ${day}</strong><br><br>
No attendance data available.
`;

document.getElementById("popup").style.display = "block";

});

}


/* CLOSE POPUP */

function closePopup() {
document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
