<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Our courses</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lessons.css">
</head>

<body>
  <div class="app-shell courses-shell">

    <button class="back-btn courses-back-btn" onclick="location.href='/student/dashboard'">
      <span>←</span>
    </button>

    <h1 class="courses-title-fixed">Our Courses</h1>

    <div class="courses-main-fixed">

      <!-- Basic English -->
      <div class="course-card-fixed">
        <div class="course-img-wrapper-fixed">
          <img src="../assets/course-english.png" alt="Basic English" />
        </div>
        <button class="btn course-btn-fixed" onclick="location.href='/student/english-levels'">
          Basic English
        </button>
      </div>

      <!-- Basic Coding -->
      <div class="course-card-fixed">
        <div class="course-img-wrapper-fixed">
          <img src="../assets/course-coding.png" alt="Basic Coding" />
        </div>
        <button class="btn course-btn-fixed" onclick="location.href='/student/coding-levels'">
          Basic Coding
        </button>
      </div>

      <!-- Basic Maths -->
      <div class="course-card-fixed">
        <div class="course-img-wrapper-fixed">
          <img src="../assets/course-maths.png" alt="Basic Maths" />
        </div>
        <button class="btn course-btn-fixed" onclick="location.href='/student/maths-levels'">
          Basic Maths
        </button>
      </div>

    </div>
  </div>
</body>
</html>
