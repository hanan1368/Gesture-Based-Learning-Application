<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Who is using?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
  <div class="role-container">

    <h1 class="page-title role-title">Who is using?</h1>

    <div class="role-grid">
      <div class="role-card">
        <img src="/assets/role-student.png" alt="Student" />
        <a class="btn role-label" href="/login?role=student">Student</a>
      </div>

      <div class="role-card">
        <img src="/assets/role-parent.png" alt="Parent" />
        <a class="btn role-label" href="/login?role=parent">Parent</a>
      </div>

      <div class="role-card">
        <img src="/assets/role-admin.png" alt="Admin" />
        <a class="btn role-label" href="/login?role=admin">Admin</a>
      </div>
    </div>

  </div>
</body>
</html>
