<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Parent Dashboard</title>

<link rel="stylesheet" href="/css/style.css">

<style>

/* PROFILE */

.profile-container{
position:fixed;
top:20px;
right:25px;
display:flex;
align-items:center;
gap:8px;
cursor:pointer;
}

.profile-name{
font-weight:bold;
}

.profile-icon{
width:40px;
height:40px;
border-radius:50%;
background:#c2527a;
display:flex;
align-items:center;
justify-content:center;
}

.profile-icon svg{
width:20px;
height:20px;
fill:white;
}

/* PROFILE POPUP */

.profile-popup{
position:fixed;
top:70px;
right:25px;
background:white;
border-radius:12px;
padding:15px;
width:150px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
display:none;
}

.popup-username{
font-weight:bold;
margin-bottom:10px;
text-align:center;
}

.logout-btn{
display:block;
text-align:center;
background:#c2527a;
color:white;
padding:8px;
border-radius:8px;
text-decoration:none;
font-weight:bold;
}

/* ANNOUNCEMENT BAR */

.announcement-bar{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:#c2527a;
color:white;
padding:12px 40px;
border-radius:40px;
font-weight:bold;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.announcement-dropdown{
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
background:white;
border-radius:15px;
padding:15px;
width:260px;
box-shadow:0 8px 20px rgba(0,0,0,0.2);
display:none;
}

.announcement-item{
margin-bottom:10px;
font-size:14px;
}

/* BACK BUTTON */

.back-btn{
position:fixed;
top:20px;
left:20px;
width:42px;
height:42px;
background:#6fd48a;
color:#fff;
text-decoration:none;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

body{
margin:0;
background:#f8cfd4;
}

.page{
max-width:1200px;
margin:auto;
padding:40px 20px;
text-align:center;
}

.cards{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
}

.card{
background:#fde9e4;
width:260px;
height:260px;
border-radius:40px;
text-decoration:none;
color:#000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

</style>

</head>

<body>

<a href="/login?role=parent" class="back-btn">←</a>

<!-- ANNOUNCEMENTS -->

<div class="announcement-bar" onclick="toggleAnnouncements()">
Announcements
</div>

<div class="announcement-dropdown" id="announcementDropdown">

<div th:each="a : ${announcements}" class="announcement-item">
<strong th:text="${a.title}"></strong>
<p th:text="${a.message}"></p>
</div>

</div>

<!-- PROFILE -->

<div class="profile-container" onclick="toggleProfileMenu()">

<span class="profile-name" th:text="${username}">parent_id</span>

<div class="profile-icon">
<svg viewBox="0 0 24 24">
<path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
</svg>
</div>

</div>

<div class="profile-popup" id="profilePopup">

<div class="popup-username" th:text="${username}"></div>

<a href="/logout" class="logout-btn">Logout</a>

</div>

<div class="page">

<h1>Parent Dashboard</h1>

<h2>Track Your Child’s Improvement</h2>

<div class="cards">

<a class="card" href="/parent/progress">
<img src="/assets/parent-progress.png">
<span>Progress</span>
</a>

<a class="card" href="/parent/attendance">
<img src="/assets/parent-attendance.png">
<span>Attendance</span>
</a>

<a class="card" href="/parent/rewards">
<img src="/assets/parent-rewards.png">
<span>Rewards</span>
</a>

<a class="card" href="/parent/feedback">
<img src="/assets/parent-feedback.png">
<span>Feedback</span>
</a>

</div>

</div>

<script>

function toggleAnnouncements(){
const box=document.getElementById("announcementDropdown");
box.style.display = box.style.display==="block" ? "none":"block";
}

function toggleProfileMenu(){
const popup=document.getElementById("profilePopup");
popup.style.display = popup.style.display==="block" ? "none":"block";
}

window.onclick=function(event){

if(!event.target.closest('.announcement-bar')){
document.getElementById("announcementDropdown").style.display="none";
}

if(!event.target.closest('.profile-container')){
document.getElementById("profilePopup").style.display="none";
}

}

</script>

</body>
</html>
